name: terraform

on:
  push: {} # every branch

# Every push gets a plan (read-only role, no gate) for visibility. Only
# master additionally gets an apply, gated behind the "prod" Environment
# (manual approval) and using the full-admin role — restricted via this
# job's own `if`, not by the plan job being skipped. Neither role is
# assumable from a pull_request-triggered run (different `sub` claim, not
# tied to a ref or environment), so this doesn't trigger on `pull_request`.

permissions:
  id-token: write # required to fetch the OIDC token for AssumeRoleWithWebIdentity
  contents: read

concurrency:
  group: terraform-root
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - uses: hashicorp/setup-terraform@v4

      - run: terraform init

      - run: terraform fmt -check

      - run: terraform validate

      - name: terraform plan
        run: terraform plan -no-color -out=tfplan | tee plan.txt

      - uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

      - name: add plan output to job summary
        run: |
          {
            echo '## Terraform Plan'
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    # `success()` must be explicit here: a job's own `if:` replaces the
    # implicit success-of-needs check that `needs:` normally applies on
    # its own, it doesn't get ANDed in automatically. Without this, apply
    # would run on master even after a failed plan.
    if: success() && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: plan
    environment: prod # manual approval gate — configure required reviewers on this Environment in repo Settings
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: tfplan

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4

      - run: terraform init

      - name: terraform apply
        run: terraform apply tfplan
