name: terraform

on:
  push: {} # every branch

# Every push gets a plan (read-only role, no gate) for visibility. Only
# master additionally gets an apply, gated behind the "prod" Environment
# (manual approval) and using the full-admin role — restricted via this
# job's own `if`, not by the plan job being skipped. Neither role is
# assumable from a pull_request-triggered run (different `sub` claim, not
# tied to a ref or environment), so this doesn't trigger on `pull_request`.

permissions:
  id-token: write # required to fetch the OIDC token for AssumeRoleWithWebIdentity
  contents: read

concurrency:
  group: terraform-root
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4

      - run: terraform init

      - run: terraform fmt -check

      - run: terraform validate

      - name: terraform plan
        run: terraform plan -no-color -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  apply:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: plan
    environment: prod # manual approval gate — configure required reviewers on this Environment in repo Settings
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: tfplan

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4

      - run: terraform init

      - name: terraform apply
        run: terraform apply tfplan
