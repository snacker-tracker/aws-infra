name: terraform

on:
  push:
    branches: [master]

# Note: this only runs on pushes to master, because the IAM role's trust
# policy is restricted to that ref (for the `plan` job) plus the "prod"
# GitHub Environment (for `apply`) — see github_oidc.tf. A pull_request-
# triggered run would fail to authenticate, since GitHub's OIDC token for
# PR events has a different `sub` claim (not tied to a ref or environment).
# Add a separate, lower-privilege plan-only role if PR plans are wanted
# later.

permissions:
  id-token: write # required to fetch the OIDC token for AssumeRoleWithWebIdentity
  contents: read

concurrency:
  group: terraform-root
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4

      - run: terraform init

      - run: terraform fmt -check

      - run: terraform validate

      - name: terraform plan
        run: terraform plan -no-color -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  apply:
    runs-on: ubuntu-latest
    needs: plan
    environment: prod # manual approval gate — configure required reviewers on this Environment in repo Settings
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: tfplan

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4

      - run: terraform init

      - name: terraform apply
        run: terraform apply tfplan
