name: terraform

on:
  push:
    branches: [master]

# Note: this only runs on pushes to main, because the IAM role's trust
# policy is restricted to `ref:refs/heads/main` (see github_oidc.tf). A
# pull_request-triggered run would fail to authenticate, since GitHub's
# OIDC token for PR events has a different `sub` claim (not tied to a
# ref). Add a separate, lower-privilege plan-only role if PR plans are
# wanted later.

permissions:
  id-token: write # required to fetch the OIDC token for AssumeRoleWithWebIdentity
  contents: read

concurrency:
  group: terraform-root
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: debug oidc token claims
        run: |
          curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
          | jq -r '.value' | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4

      - run: terraform init

      - run: terraform fmt -check

      - run: terraform validate

      - name: terraform plan
        run: terraform plan -no-color

      - name: terraform apply
        run: terraform apply -auto-approve
